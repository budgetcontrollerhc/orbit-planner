<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit — Day &amp; Week Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0E0F22;
    --bg-soft: #14162D;
    --surface: #1B1E3B;
    --surface-hi: #232649;
    --border: #2E3160;
    --text: #F3F3FC;
    --text-dim: #9A9DC7;
    --text-faint: #6C6F9E;

    --work: #4361FF;
    --work-soft: rgba(67,97,255,0.16);
    --personal: #FF3D81;
    --personal-soft: rgba(255,61,129,0.16);
    --leisure: #2FE6B4;
    --leisure-soft: rgba(47,230,180,0.16);

    --mustdo: #FFB627;
    --mustdo-soft: rgba(255,182,39,0.14);
    --urgent: #FF4757;
    --urgent-soft: rgba(255,71,87,0.14);
    --avoid: #8B8FD1;
    --avoid-soft: rgba(139,143,209,0.12);

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(67,97,255,0.20), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,61,129,0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .display{ font-family: 'Space Grotesk', 'Inter', sans-serif; }

  button{ font-family: inherit; cursor:pointer; }
  input, select, textarea{ font-family: inherit; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:8px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  .app{
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 28px 60px;
    display:flex;
    flex-direction:column;
    gap:22px;
    min-height:100%;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px;
    background: conic-gradient(from 200deg, var(--work), var(--personal), var(--leisure), var(--work));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 6px 18px rgba(67,97,255,0.35);
    flex-shrink:0;
  }
  .brand h1{ font-size:22px; font-weight:700; margin:0; letter-spacing:0.2px; }
  .brand p{ margin:2px 0 0; font-size:12.5px; color:var(--text-dim); }

  .view-toggle{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-md); padding:4px; gap:4px;
  }
  .view-toggle button{
    border:none; background:transparent; color:var(--text-dim);
    padding:8px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
    transition: all .15s ease;
  }
  .view-toggle button.active{ background:var(--work); color:white; }

  .date-nav{ display:flex; align-items:center; gap:10px; }
  .date-nav button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; display:flex;
    align-items:center; justify-content:center;
  }
  .date-nav button:hover{ background: var(--surface-hi); }
  .date-label{ font-size:14.5px; font-weight:600; min-width:170px; text-align:center; }
  .today-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    padding:8px 14px; border-radius:9px; font-size:12.5px; font-weight:600;
  }
  .today-btn:hover{ color:var(--text); background:var(--surface-hi); }

  /* ---------- SYNC BAR ---------- */
  .sync-bar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    background:var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-md); padding:12px 16px;
  }
  .sync-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sync-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:600; margin-right:2px; }
  .btn{
    border:1px solid var(--border); background:var(--surface-hi); color:var(--text);
    padding:8px 14px; border-radius:9px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px; transition: transform .1s ease, background .15s ease;
  }
  .btn:hover{ background:#2A2D57; }
  .btn:active{ transform: scale(0.97); }
  .btn.google{ border-color: rgba(67,97,255,0.5); }
  .btn.google:hover{ background: var(--work-soft); }
  .btn.primary{ background: var(--work); border-color: var(--work); }
  .btn.primary:hover{ background:#3450e6; }
  .btn.ghost{ background:transparent; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--leisure); flex-shrink:0; }
  .sync-status{ font-size:12px; color:var(--text-dim); margin-left:4px; }
  input[type=file]{ display:none; }

  /* ---------- LAYOUT ---------- */
  .layout{ display:grid; grid-template-columns: 320px 1fr; gap:22px; align-items:start; }
  @media (max-width: 980px){ .layout{ grid-template-columns: 1fr; } }

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-lg); padding:20px;
  }
  .panel h2{ font-size:14px; margin:0 0 14px; font-weight:700; }
  .panel h2 .count{ color:var(--text-faint); font-weight:500; }

  /* ---------- QUICK ADD ---------- */
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:6px; font-weight:600; letter-spacing:0.02em; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field select, .field textarea{
    width:100%; background:var(--bg-soft); border:1px solid var(--border); color:var(--text);
    padding:9px 11px; border-radius:9px; font-size:13.5px; outline:none;
  }
  .field textarea{ resize:vertical; min-height:44px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--work); box-shadow: 0 0 0 3px var(--work-soft); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .type-picker, .cat-picker{ display:flex; gap:6px; }
  .chip{
    flex:1; text-align:center; padding:8px 6px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg-soft); color:var(--text-dim); font-size:12px; font-weight:600;
  }
  .chip.selected{ color:white; border-color:transparent; }
  .chip[data-cat="work"].selected{ background:var(--work); }
  .chip[data-cat="personal"].selected{ background:var(--personal); }
  .chip[data-cat="leisure"].selected{ background:var(--leisure); color:#06231C; }
  .chip[data-type].selected{ background:var(--surface-hi); border-color: var(--text-faint); color:var(--text); }

  .suggest-line{ font-size:11.5px; color:var(--text-faint); margin:-4px 0 12px; min-height:14px; }
  .suggest-line b{ color:var(--text-dim); }

  .checkline{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); margin-bottom:14px; }
  .checkline input{ accent-color: var(--urgent); width:15px; height:15px; }

  .btn-add{ width:100%; background: linear-gradient(90deg, var(--work), #6A4CFF); border:none; color:white; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; }
  .btn-add:hover{ filter:brightness(1.08); }

  /* ---------- SMART SUGGESTIONS ---------- */
  .sugg-block{ margin-bottom:16px; }
  .sugg-head{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; margin-bottom:8px; }
  .sugg-head .swatch{ width:9px; height:9px; border-radius:3px; }
  .sugg-empty{ font-size:12px; color:var(--text-faint); padding:8px 0; }
  .sugg-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:8px 10px; border-radius:9px; margin-bottom:6px; font-size:12.5px;
  }
  .sugg-item .t{ font-weight:600; }
  .sugg-item .m{ color:var(--text-faint); font-size:11px; }
  .sugg-item.mustdo{ background: var(--mustdo-soft); border:1px solid rgba(255,182,39,0.3); }
  .sugg-item.urgent{ background: var(--urgent-soft); border:1px solid rgba(255,71,87,0.32); }
  .sugg-item.avoid{ background: var(--avoid-soft); border:1px dashed rgba(139,143,209,0.45); }

  /* ---------- MAIN TIMELINE ---------- */
  .main-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .main-head h2{ font-size:16px; margin:0; }
  .legend{ display:flex; gap:14px; }
  .legend span{ font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  .allday-strip{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .allday-strip:empty{ display:none; }

  .task-chip{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:10px;
    border-left:4px solid; font-size:13px; position:relative;
  }
  .task-chip .title{ font-weight:600; }
  .task-chip .sub{ font-size:11px; color:var(--text-faint); }
  .task-chip .x{ margin-left:auto; opacity:0.5; font-size:11px; padding:2px 6px; border-radius:6px; }
  .task-chip .x:hover{ opacity:1; background:rgba(255,255,255,0.08); }
  .task-chip .push{ opacity:0.55; font-size:10.5px; padding:2px 6px; border-radius:6px; border:1px solid rgba(255,255,255,0.15); }
  .task-chip .push:hover{ opacity:1; background:rgba(255,255,255,0.08); }

  .cat-work{ background:var(--work-soft); border-left-color:var(--work); }
  .cat-personal{ background:var(--personal-soft); border-left-color:var(--personal); }
  .cat-leisure{ background:var(--leisure-soft); border-left-color:var(--leisure); }

  /* Day timeline */
  .timeline{ position:relative; border-top:1px solid var(--border); }
  .hour-row{ display:grid; grid-template-columns:64px 1fr; border-bottom:1px solid var(--border); min-height:58px; }
  .hour-label{ font-size:11px; color:var(--text-faint); padding:6px 10px 0 0; text-align:right; }
  .hour-track{ position:relative; padding:6px 8px; }
  .hour-track .task-chip{ margin-bottom:6px; }

  .empty-day{ padding:40px 10px; text-align:center; color:var(--text-faint); font-size:13px; }
  .empty-day .big{ font-size:26px; display:block; margin-bottom:8px; }

  /* Week view */
  .week-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; }
  .week-col{ background:var(--bg-soft); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:220px; }
  .week-col.is-today{ border-color: var(--work); box-shadow:0 0 0 1px var(--work) inset; }
  .week-col-head{ font-size:11.5px; font-weight:700; color:var(--text-dim); margin-bottom:8px; text-align:center; }
  .week-col-head .num{ display:block; font-size:16px; color:var(--text); font-family:'Space Grotesk'; }
  .week-empty{ font-size:11px; color:var(--text-faint); text-align:center; padding:14px 0; }
  .week-col .task-chip{ margin-bottom:6px; padding:7px 9px; font-size:11.5px; }

  @media (max-width: 980px){
    .week-grid{ grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>Orbit</h1>
        <p>Plan the day. Spot what matters. Skip what doesn't.</p>
      </div>
    </div>

    <div class="view-toggle">
      <button id="btnDayView" class="active">Day</button>
      <button id="btnWeekView">Week</button>
    </div>

    <div class="date-nav">
      <button id="prevBtn">‹</button>
      <div class="date-label" id="dateLabel"></div>
      <button id="nextBtn">›</button>
      <button class="today-btn" id="todayBtn">Today</button>
    </div>
  </div>

  <div class="sync-bar">
    <div class="sync-group">
      <span class="sync-label">Calendar sync (.ics — Google, Outlook, Apple &amp; more)</span>
      <button class="btn" id="icsExportBtn">Export .ics</button>
      <button class="btn" id="icsImportBtn">Import .ics</button>
      <input type="file" id="icsFileInput" accept=".ics" />
    </div>
    <div class="sync-status" id="syncStatus"></div>
  </div>

  <div class="layout">
    <!-- LEFT RAIL -->
    <div style="display:flex; flex-direction:column; gap:20px;">

      <div class="panel">
        <h2>Add to plan</h2>
        <form id="addForm">
          <div class="field">
            <label>What is it?</label>
            <input type="text" id="titleInput" placeholder="e.g. Client sync at 3, or Sunday hike" required />
          </div>
          <div class="suggest-line" id="suggestLine">&nbsp;</div>

          <div class="field">
            <label>Type</label>
            <div class="type-picker">
              <div class="chip selected" data-type="task">Task</div>
              <div class="chip" data-type="event">Event</div>
              <div class="chip" data-type="reminder">Reminder</div>
            </div>
          </div>

          <div class="field">
            <label>Category</label>
            <div class="cat-picker">
              <div class="chip" data-cat="work">Work</div>
              <div class="chip" data-cat="personal">Personal</div>
              <div class="chip" data-cat="leisure">Leisure</div>
            </div>
          </div>

          <div class="row2">
            <div class="field">
              <label>Date</label>
              <input type="date" id="dateInput" required />
            </div>
            <div class="field">
              <label>Time (optional)</label>
              <input type="time" id="timeInput" />
            </div>
          </div>

          <div class="row2">
            <div class="field">
              <label>Duration (min)</label>
              <input type="number" id="durationInput" min="5" step="5" value="30" />
            </div>
            <div class="field">
              <label>Priority</label>
              <select id="priorityInput">
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </div>
          </div>

          <div class="checkline">
            <input type="checkbox" id="deadlineInput" />
            <label for="deadlineInput">Has a hard deadline (flag as urgent when close)</label>
          </div>

          <div class="field">
            <label>Notes (optional)</label>
            <textarea id="notesInput" placeholder="Any detail worth remembering"></textarea>
          </div>

          <button type="submit" class="btn-add">Add to plan</button>
        </form>
      </div>

      <div class="panel">
        <h2>Smart picks <span class="count" id="suggRangeLabel"></span></h2>

        <div class="sugg-block">
          <div class="sugg-head"><span class="swatch" style="background:var(--mustdo)"></span>Must do</div>
          <div id="mustdoList"></div>
        </div>
        <div class="sugg-block">
          <div class="sugg-head"><span class="swatch" style="background:var(--urgent)"></span>Urgent</div>
          <div id="urgentList"></div>
        </div>
        <div class="sugg-block" style="margin-bottom:0;">
          <div class="sugg-head"><span class="swatch" style="background:var(--avoid)"></span>Reconsider / avoid</div>
          <div id="avoidList"></div>
        </div>
      </div>

    </div>

    <!-- MAIN -->
    <div class="panel" id="mainPanel">
      <div class="main-head">
        <h2 id="mainHeading">Today</h2>
        <div class="legend">
          <span><i style="background:var(--work)"></i>Work</span>
          <span><i style="background:var(--personal)"></i>Personal</span>
          <span><i style="background:var(--leisure)"></i>Leisure</span>
        </div>
      </div>
      <div class="allday-strip" id="alldayStrip"></div>
      <div id="mainBody"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------------- STATE ----------------
  let tasks = [];
  let idCounter = 1;
  let view = 'day';
  let currentDate = startOfDay(new Date());
  let pendingType = 'task';
  let pendingCat = null;

  const WORK_KW = ['meeting','call','project','deadline','report','client','email','presentation','standup','sync','work','office','invoice','budget','review','ticket','sprint','interview','proposal','contract','boss','manager','team'];
  const LEISURE_KW = ['movie','game','gym','hobby','read','music','party','vacation','trip','netflix','walk','hike','sport','relax','friends','concert','show','watch','play','beach','travel','fun','festival','bar','date night'];
  const PERSONAL_KW = ['doctor','appointment','dentist','bank','grocery','clean','bill','kids','mom','dad','family','car','repair','pay','laundry','errand','pharmacy','school','pet','vet','home'];

  // ---------------- HELPERS ----------------
  function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function iso(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function startOfWeek(d){ const x = startOfDay(d); const day = (x.getDay()+6)%7; return addDays(x, -day); } // Monday start
  function genId(){ return 'orb_' + (idCounter++) + '_' + Math.random().toString(36).slice(2,7); }
  function fmtDateLabel(d){ return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric', year:'numeric' }); }
  function fmtTime(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const ampm = h>=12 ? 'PM':'AM'; const h12 = ((h+11)%12)+1;
    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  function taskDateTime(t){
    if(!t.date) return null;
    if(t.time){ return new Date(`${t.date}T${t.time}:00`); }
    return new Date(`${t.date}T23:59:00`);
  }
  function detectCategory(text){
    const s = (text||'').toLowerCase();
    let score = {work:0, personal:0, leisure:0};
    WORK_KW.forEach(k=>{ if(s.includes(k)) score.work++; });
    LEISURE_KW.forEach(k=>{ if(s.includes(k)) score.leisure++; });
    PERSONAL_KW.forEach(k=>{ if(s.includes(k)) score.personal++; });
    const best = Object.entries(score).sort((a,b)=>b[1]-a[1])[0];
    return best[1] > 0 ? best[0] : 'personal';
  }
  function setStatus(msg){ document.getElementById('syncStatus').textContent = msg || ''; }

  // ---------------- QUICK ADD WIRING ----------------
  const titleInput = document.getElementById('titleInput');
  const suggestLine = document.getElementById('suggestLine');
  titleInput.addEventListener('input', ()=>{
    const val = titleInput.value.trim();
    if(!val){ suggestLine.innerHTML = '&nbsp;'; return; }
    const guess = detectCategory(val);
    suggestLine.innerHTML = `Suggested category: <b>${guess}</b> — tap a category chip to confirm or change it.`;
    if(!pendingCat){
      document.querySelectorAll('.cat-picker .chip').forEach(c=>{
        c.classList.toggle('selected', c.dataset.cat === guess);
      });
      pendingCat = guess;
      pendingCat_auto = true;
    }
  });
  let pendingCat_auto = true;

  document.querySelectorAll('.type-picker .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.type-picker .chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      pendingType = chip.dataset.type;
    });
  });
  document.querySelectorAll('.cat-picker .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.cat-picker .chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      pendingCat = chip.dataset.cat;
      pendingCat_auto = false;
    });
  });

  document.getElementById('dateInput').value = iso(currentDate);

  document.getElementById('addForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const title = titleInput.value.trim();
    if(!title) return;
    const category = pendingCat || detectCategory(title);
    const task = {
      id: genId(),
      title,
      type: pendingType,
      category,
      date: document.getElementById('dateInput').value || iso(currentDate),
      time: document.getElementById('timeInput').value || '',
      duration: Number(document.getElementById('durationInput').value) || 30,
      priority: document.getElementById('priorityInput').value,
      deadline: document.getElementById('deadlineInput').checked,
      notes: document.getElementById('notesInput').value.trim(),
      completed: false,
      source: 'manual'
    };
    tasks.push(task);
    // reset form partially
    titleInput.value=''; suggestLine.innerHTML='&nbsp;';
    document.getElementById('timeInput').value='';
    document.getElementById('notesInput').value='';
    document.getElementById('deadlineInput').checked=false;
    pendingCat = null; pendingCat_auto = true;
    document.querySelectorAll('.cat-picker .chip').forEach(c=>c.classList.remove('selected'));
    renderAll();
  });

  // ---------------- VIEW TOGGLES ----------------
  document.getElementById('btnDayView').addEventListener('click', ()=>{ view='day'; syncViewButtons(); renderAll(); });
  document.getElementById('btnWeekView').addEventListener('click', ()=>{ view='week'; syncViewButtons(); renderAll(); });
  function syncViewButtons(){
    document.getElementById('btnDayView').classList.toggle('active', view==='day');
    document.getElementById('btnWeekView').classList.toggle('active', view==='week');
  }
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    currentDate = addDays(currentDate, view==='day' ? -1 : -7);
    renderAll();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    currentDate = addDays(currentDate, view==='day' ? 1 : 7);
    renderAll();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    currentDate = startOfDay(new Date());
    renderAll();
  });

  // ---------------- SMART SUGGESTIONS ----------------
  function computeSuggestions(rangeStartISO, rangeEndISO){
    const now = new Date();
    const inRange = tasks.filter(t => !t.completed && t.date >= rangeStartISO && t.date <= rangeEndISO);
    const mustDo = [], urgent = [], avoid = [];
    const seen = new Set();

    inRange.forEach(t=>{
      const dt = taskDateTime(t);
      const hrsUntil = dt ? (dt - now)/3600000 : null;
      const overdue = hrsUntil !== null && hrsUntil < 0;

      if(overdue){ urgent.push(t); seen.add(t.id); return; }
      if(t.deadline && hrsUntil !== null && hrsUntil <= 6){ urgent.push(t); seen.add(t.id); return; }
      if(t.priority === 'high'){ mustDo.push(t); seen.add(t.id); return; }
    });

    inRange.forEach(t=>{
      if(seen.has(t.id)) return;
      if(t.category === 'leisure' && t.priority === 'low'){
        const sameDayWork = inRange.some(o => o.date === t.date && o.category === 'work' && (o.priority === 'high' || (o.deadline)));
        if(sameDayWork){ avoid.push(t); }
      }
    });

    const byTime = (a,b) => (a.time||'99:99').localeCompare(b.time||'99:99');
    return { mustDo: mustDo.sort(byTime), urgent: urgent.sort(byTime), avoid: avoid.sort(byTime) };
  }

  function renderSuggestions(){
    let rs, re, label;
    if(view === 'day'){ rs = re = iso(currentDate); label = 'today'; }
    else { const s = startOfWeek(currentDate); rs = iso(s); re = iso(addDays(s,6)); label = 'this week'; }
    document.getElementById('suggRangeLabel').textContent = `· ${label}`;

    const { mustDo, urgent, avoid } = computeSuggestions(rs, re);
    fillSuggList('mustdoList', mustDo, 'mustdo', 'Nothing critical flagged — nice and clear.');
    fillSuggList('urgentList', urgent, 'urgent', 'No overdue or closing deadlines.');
    fillSuggList('avoidList', avoid, 'avoid', 'No low-value clashes with your work load.');
  }

  function fillSuggList(elId, list, cls, emptyMsg){
    const el = document.getElementById(elId);
    if(list.length === 0){ el.innerHTML = `<div class="sugg-empty">${emptyMsg}</div>`; return; }
    el.innerHTML = list.map(t => `
      <div class="sugg-item ${cls}">
        <div>
          <div class="t">${escapeHtml(t.title)}</div>
          <div class="m">${t.date}${t.time ? ' · ' + fmtTime(t.time) : ''} · ${t.category}</div>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- MAIN RENDER ----------------
  function renderAll(){
    document.getElementById('dateInput').min = '';
    if(view === 'day'){
      document.getElementById('dateLabel').textContent = fmtDateLabel(currentDate);
      document.getElementById('mainHeading').textContent = isSameISO(currentDate, new Date()) ? 'Today' : fmtDateLabel(currentDate);
      renderDayView();
    } else {
      const s = startOfWeek(currentDate), e = addDays(s,6);
      document.getElementById('dateLabel').textContent = `${s.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${e.toLocaleDateString(undefined,{month:'short',day:'numeric', year:'numeric'})}`;
      document.getElementById('mainHeading').textContent = 'This week';
      renderWeekView(s);
    }
    renderSuggestions();
  }
  function isSameISO(a,b){ return iso(a) === iso(b); }

  function taskChipHTML(t, compact){
    const timeStr = t.time ? fmtTime(t.time) : (t.type === 'reminder' ? 'Reminder' : 'Anytime');
    return `
      <div class="task-chip cat-${t.category}">
        <div>
          <div class="title">${escapeHtml(t.title)}</div>
          <div class="sub">${timeStr}${!compact && t.duration ? ' · ' + t.duration + 'm' : ''} · ${t.type}</div>
        </div>
        <div class="x" data-del="${t.id}">✕</div>
      </div>
    `;
  }

  function renderDayView(){
    const dISO = iso(currentDate);
    const dayTasks = tasks.filter(t => t.date === dISO);
    const timed = dayTasks.filter(t => t.time);
    const untimed = dayTasks.filter(t => !t.time);

    const alldayStrip = document.getElementById('alldayStrip');
    alldayStrip.innerHTML = untimed.map(t => taskChipHTML(t, true)).join('');

    const body = document.getElementById('mainBody');
    if(dayTasks.length === 0){
      body.innerHTML = `<div class="empty-day"><span class="big">☾</span>Nothing planned yet. Add a task, event or reminder on the left.</div>`;
      wireChipEvents();
      return;
    }

    const startHour = 6, endHour = 23;
    let html = '<div class="timeline">';
    for(let h = startHour; h <= endHour; h++){
      const hourTasks = timed.filter(t => Number(t.time.split(':')[0]) === h);
      const label = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h-12} PM`;
      html += `<div class="hour-row"><div class="hour-label">${label}</div><div class="hour-track">${hourTasks.map(t=>taskChipHTML(t,false)).join('')}</div></div>`;
    }
    html += '</div>';
    body.innerHTML = html;
    wireChipEvents();
  }

  function renderWeekView(weekStart){
    const body = document.getElementById('mainBody');
    document.getElementById('alldayStrip').innerHTML = '';
    const todayISO = iso(new Date());
    let html = '<div class="week-grid">';
    for(let i=0;i<7;i++){
      const d = addDays(weekStart, i);
      const dISO = iso(d);
      const dayTasks = tasks.filter(t => t.date === dISO).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
      html += `<div class="week-col ${dISO===todayISO?'is-today':''}">
        <div class="week-col-head">${d.toLocaleDateString(undefined,{weekday:'short'})}<span class="num">${d.getDate()}</span></div>
        ${dayTasks.length ? dayTasks.map(t=>taskChipHTML(t,true)).join('') : '<div class="week-empty">Clear</div>'}
      </div>`;
    }
    html += '</div>';
    body.innerHTML = html;
    wireChipEvents();
  }

  function wireChipEvents(){
    document.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', ()=>{
        tasks = tasks.filter(t => t.id !== el.dataset.del);
        renderAll();
      });
    });
  }

  // ---------------- ICS EXPORT ----------------
  function pad(n){ return String(n).padStart(2,'0'); }
  function toICSDate(dateISO, timeStr){
    const [y,m,d] = dateISO.split('-');
    if(!timeStr) return { allDay:true, str: `${y}${m}${d}` };
    const [hh,mm] = timeStr.split(':');
    return { allDay:false, str: `${y}${m}${d}T${hh}${mm}00` };
  }
  function buildICS(){
    let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit Planner//EN','CALSCALE:GREGORIAN'];
    tasks.forEach(t=>{
      const start = toICSDate(t.date, t.time);
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + t.id + '@orbitplanner');
      lines.push('DTSTAMP:' + new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z');
      if(start.allDay){
        lines.push('DTSTART;VALUE=DATE:' + start.str);
      } else {
        lines.push('DTSTART:' + start.str);
        const durMs = (t.duration||30) * 60000;
        const endDate = new Date(`${t.date}T${t.time}:00`);
        endDate.setTime(endDate.getTime() + durMs);
        const endStr = `${endDate.getFullYear()}${pad(endDate.getMonth()+1)}${pad(endDate.getDate())}T${pad(endDate.getHours())}${pad(endDate.getMinutes())}00`;
        lines.push('DTEND:' + endStr);
      }
      lines.push('SUMMARY:' + (t.title||'').replace(/\n/g,' '));
      if(t.notes) lines.push('DESCRIPTION:' + t.notes.replace(/\n/g,' '));
      lines.push('CATEGORIES:' + t.category.toUpperCase());
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  document.getElementById('icsExportBtn').addEventListener('click', ()=>{
    if(tasks.length === 0){ setStatus('Nothing to export yet — add a few items first.'); return; }
    const blob = new Blob([buildICS()], { type:'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'orbit-plan.ics';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus('Exported orbit-plan.ics — import it into Outlook, Apple Calendar, or Google Calendar.');
  });

  // ---------------- ICS IMPORT ----------------
  document.getElementById('icsImportBtn').addEventListener('click', ()=>{
    document.getElementById('icsFileInput').click();
  });
  document.getElementById('icsFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const count = importICSText(reader.result);
        setStatus(`Imported ${count} item(s) from ${file.name}.`);
        renderAll();
      }catch(err){
        setStatus('Could not read that .ics file. Make sure it is a standard calendar export.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  function importICSText(text){
    const blocks = text.split('BEGIN:VEVENT').slice(1);
    let count = 0;
    blocks.forEach(block=>{
      const summaryMatch = block.match(/SUMMARY:(.*)/);
      const dtStartMatch = block.match(/DTSTART[^:]*:(\d{8})(T(\d{2})(\d{2}))?/);
      if(!summaryMatch || !dtStartMatch) return;
      const title = summaryMatch[1].trim();
      const y = dtStartMatch[1].slice(0,4), m = dtStartMatch[1].slice(4,6), d = dtStartMatch[1].slice(6,8);
      const time = dtStartMatch[3] ? `${dtStartMatch[3]}:${dtStartMatch[4]}` : '';
      tasks.push({
        id: genId(), title, type:'event', category: detectCategory(title),
        date: `${y}-${m}-${d}`, time, duration:60, priority:'medium',
        deadline:false, notes:'', completed:false, source:'ics'
      });
      count++;
    });
    return count;
  }

  // ---------------- INIT ----------------
  renderAll();
})();
</script>
</body>
</html>
